[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-gen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pillow>=10",
    "jinja2>=3.1",
    "reportlab>=4.2",
    "python-bidi>=0.5",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
strict = true
[[tool.mypy.overrides]]
module = ["pymupdf.*", "pytesseract.*", "reportlab.*", "bidi.*", "cv2.*"]
ignore_missing_imports = true